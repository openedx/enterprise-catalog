name: Migration check on MySql8

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  check_migrations:
    name: check migration for MySql8
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ 3.12 ]

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libxmlsec1-dev
    - name: Get pip cache dir
      id: pip-cache-dir
      run: |
        echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
    - name: Cache pip dependencies
      id: cache-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pip-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements/pip_tools.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Ubunto and sql versions
      run: |
        lsb_release -a
        mysql -V
    - name: Install Python Dependencies
      run: |
        pip install -r requirements/pip-tools.txt
        pip install -r requirements/production.txt
        pip uninstall -y mysqlclient
        pip install --no-binary mysqlclient mysqlclient
        pip uninstall -y xmlsec
        pip install --no-binary xmlsec xmlsec==1.3.13
    - name: Initiate services
      run: |
        sudo /etc/init.d/mysql start
    - name: Reset mysql password
      run: |
        cat <<EOF | mysql -h 127.0.0.1 -u root --password=root
          UPDATE mysql.user SET authentication_string = null WHERE user = 'root';
          FLUSH PRIVILEGES;
        EOF
    - name: Run migrations
      env:
        DB_ENGINE: "django.db.backends.mysql"
        DB_NAME: "enterprise_catalog"
        DB_USER: root
        DB_PASSWORD:
        DB_HOST: localhost
        DB_PORT: 3306
      run: |
        echo "CREATE DATABASE IF NOT EXISTS enterprise_catalog;" | sudo mysql -u root
        echo "Running the migrations"
        python manage.py migrate --settings=enterprise_catalog.settings.test
